[workspace]
resolver = "2"
members = ["crates/dmem-contracts", "crates/dmem-core", "crates/dmem-server", "crates/dmem-client", "crates/dmem-cli", "crates/dmem-mcp"]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
[workspace.dependencies]
dmem-contracts = { path = "crates/dmem-contracts" }
dmem-core = { path = "crates/dmem-core" }
dmem-client = { path = "crates/dmem-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
http-body-util = "0.1"
