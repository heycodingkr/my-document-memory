        <path d="m88 406 7 7 10-14" fill="none" stroke="#fffef4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="132" y="416" font-size="26" font-weight="600">Ship the onboarding update</text>
        <rect x="80" y="455" width="31" height="31" rx="5" fill="#466b4b"/>
        <path d="m88 470 7 7 10-14" fill="none" stroke="#fffef4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="132" y="480" font-size="26" font-weight="600">Review the launch draft</text>
        <rect x="80" y="519" width="31" height="31" rx="5" fill="#466b4b"/>
        <path d="m88 534 7 7 10-14" fill="none" stroke="#fffef4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="132" y="544" font-size="26" font-weight="600">Share notes with the support team</text>
        <path d="M80 589H904" stroke="#dce3d8" stroke-width="2"/>
        <text x="80" y="637" font-size="18" letter-spacing="2" fill="#73816c">IN PROGRESS</text>
        <rect x="80" y="670" width="29" height="29" rx="5" fill="none" stroke="#91a57f" stroke-width="2"/>
        <text x="132" y="695" font-size="25" font-weight="600">Plan the next customer interviews</text>
        <text x="132" y="734" font-size="21" fill="#73816c">Owner: Product / Due: next week</text>
        <rect x="80" y="779" width="824" height="251" rx="9" fill="#f0f3e9"/>
        <text x="111" y="823" font-size="18" letter-spacing="1.5" fill="#73816c">NOTES &amp; DECISIONS</text>
        <path d="M116 863V972" stroke="#c4d2b7" stroke-width="2"/>
        <circle cx="116" cy="870" r="6" fill="#6f8a5c"/>
        <circle cx="116" cy="918" r="6" fill="#6f8a5c"/>
        <circle cx="116" cy="966" r="6" fill="#6f8a5c"/>
        <text x="144" y="878" font-size="23">Mon / Feedback reviewed</text>
        <text x="144" y="926" font-size="23">Tue / Draft revised with sources</text>
        <text x="144" y="974" font-size="23">Wed / Next actions assigned</text>
        <text x="80" y="1083" font-size="18" letter-spacing="2" fill="#73816c">NEXT UP</text>
        <rect x="80" y="1118" width="22" height="22" rx="3" fill="none" stroke="#91a57f" stroke-width="2"/>
        <text x="132" y="1141" font-size="25">Confirm the interview list</text>
        <rect x="80" y="1170" width="22" height="22" rx="3" fill="none" stroke="#91a57f" stroke-width="2"/>
        <text x="132" y="1193" font-size="25">Publish the release notes</text>
        <text x="80" y="1252" font-size="16" fill="#7e8c73">Illustrative worklog / Sample team and tasks</text>
