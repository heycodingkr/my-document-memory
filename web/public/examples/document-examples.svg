<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 3780" role="img" aria-labelledby="examples-title examples-description">
  <title id="examples-title">Examples of documents made with AI</title>
  <desc id="examples-description">Illustrative weekly report, project presentation and team worklog. All names, numbers and content are sample data.</desc>
  <defs>
    <symbol id="report-art" viewBox="0 0 1000 1320">
