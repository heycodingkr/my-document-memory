        <text x="902" y="902" font-size="21" text-anchor="end" fill="#73816c">70%</text>
        <text x="82" y="961" font-size="23">Docs &amp; handoff</text>
        <rect x="328" y="941" width="444" height="21" rx="10" fill="#e9ede2"/>
        <rect x="328" y="941" width="266" height="21" rx="10" fill="#a1b68b"/>
