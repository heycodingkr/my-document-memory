        <rect width="1000" height="1320" fill="#f0f0e7"/>
        <rect x="50" y="47" width="922" height="1249" rx="10" fill="#dedfd2"/>
        <rect x="24" y="24" width="936" height="1260" rx="10" fill="#fffef9" stroke="#dce3d8" stroke-width="2"/>
        <text x="80" y="92" font-size="17" letter-spacing="3" fill="#73816c">TEAM SPACE / PRODUCT</text>
        <text x="904" y="92" text-anchor="end" font-size="15" letter-spacing="2" fill="#73816c">EXAMPLE</text>
        <text x="80" y="179" font-size="66" font-weight="600" letter-spacing="-3">Team worklog</text>
        <text x="80" y="230" font-size="25" fill="#73816c">The week, captured as it happened.</text>
