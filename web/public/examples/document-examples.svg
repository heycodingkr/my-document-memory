        <text x="82" y="94" font-size="17" letter-spacing="3" fill="#73816c">PRODUCT / WEEKLY UPDATE</text>
        <text x="902" y="94" text-anchor="end" font-size="15" letter-spacing="2" fill="#73816c">EXAMPLE</text>
        <text x="82" y="180" font-size="66" font-weight="600" letter-spacing="-3">Weekly product</text>
        <text x="82" y="252" font-size="66" font-weight="600" letter-spacing="-3">report</text>
        <text x="82" y="306" font-size="23" fill="#788570">Week 12 / Sample product team</text>
        <rect x="690" y="276" width="212" height="43" rx="21" fill="#e9f0de"/>
        <text x="796" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#5f7950">FOR TEAM REVIEW</text>
        <path d="M82 350H902" stroke="#dce3d8" stroke-width="2"/>
        <text x="82" y="395" font-size="17" letter-spacing="2" fill="#73816c">THE SHORT VERSION</text>
        <text x="82" y="442" font-size="29">A focused week of product delivery.</text>
        <text x="82" y="485" font-size="26" fill="#718069">Key tasks are complete. The next release</text>
        <text x="82" y="523" font-size="26" fill="#718069">has clear owners and a short list of open questions.</text>
        <rect x="82" y="565" width="250" height="145" rx="8" fill="#edf2e6"/>
        <rect x="367" y="565" width="250" height="145" rx="8" fill="#f1f2e9"/>
        <rect x="652" y="565" width="250" height="145" rx="8" fill="#edf2e6"/>
        <text x="106" y="605" font-size="16" letter-spacing="1" fill="#728168">SHIPPED</text>
        <text x="106" y="681" font-size="66" font-weight="600">12</text>
        <text x="391" y="605" font-size="16" letter-spacing="1" fill="#728168">IN REVIEW</text>
        <text x="391" y="681" font-size="66" font-weight="600">3</text>
        <text x="676" y="605" font-size="16" letter-spacing="1" fill="#728168">NEXT UP</text>
        <text x="676" y="681" font-size="66" font-weight="600">5</text>
        <text x="82" y="781" font-size="31" font-weight="600">Progress at a glance</text>
        <text x="82" y="841" font-size="23">Onboarding</text>
        <rect x="328" y="821" width="444" height="21" rx="10" fill="#e9ede2"/>
        <rect x="328" y="821" width="355" height="21" rx="10" fill="#466b4b"/>
        <text x="902" y="842" font-size="21" text-anchor="end" fill="#73816c">80%</text>
