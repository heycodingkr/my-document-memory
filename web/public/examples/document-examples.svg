    <symbol id="deck-art" viewBox="0 0 1200 900">
      <g font-family="Arial, Helvetica, sans-serif">
        <rect width="1200" height="900" fill="#edf1e7"/>
        <rect x="46" y="51" width="1126" height="636" rx="12" fill="#d4dec9"/>
        <rect x="28" y="28" width="1144" height="644" rx="12" fill="#294f3d"/>
        <text x="90" y="99" font-size="17" letter-spacing="3" fill="#baccaa">NORTHSTAR / PROJECT KICKOFF</text>
        <text x="1108" y="99" text-anchor="end" font-size="17" fill="#baccaa">01</text>
        <text x="90" y="225" font-size="83" font-weight="600" letter-spacing="-3" fill="#fffef4">A shared plan</text>
        <text x="90" y="319" font-size="83" font-weight="600" letter-spacing="-3" fill="#fffef4">for the next launch.</text>
        <text x="90" y="402" font-size="27" fill="#d1dfc4">Goals, owners and milestones</text>
        <text x="90" y="446" font-size="27" fill="#d1dfc4">in a format the team can reuse.</text>
        <path d="M90 500H164" stroke="#b1c78f" stroke-width="4"/>
        <text x="90" y="554" font-size="21" fill="#baccaa">Project Northstar / Sample team</text>
        <path d="M800 535H1052" stroke="#86a37a" stroke-width="2"/>
        <circle cx="800" cy="535" r="17" fill="#a9c18e"/>
        <circle cx="926" cy="535" r="17" fill="#a9c18e"/>
        <circle cx="1052" cy="535" r="17" fill="#a9c18e"/>
        <text x="800" y="583" text-anchor="middle" font-size="19" fill="#d1dfc4">Scope</text>
        <text x="926" y="583" text-anchor="middle" font-size="19" fill="#d1dfc4">Owners</text>
        <text x="1052" y="583" text-anchor="middle" font-size="19" fill="#d1dfc4">Review</text>
        <rect x="28" y="708" width="560" height="159" rx="10" fill="#fffef9" stroke="#dce3d8" stroke-width="2"/>
        <rect x="612" y="708" width="560" height="159" rx="10" fill="#fffef9" stroke="#dce3d8" stroke-width="2"/>
        <text x="62" y="747" font-size="14" letter-spacing="1.5" fill="#73816c">02 / WHAT WE ARE SOLVING</text>
        <text x="62" y="790" font-size="24" font-weight="600" fill="#263e32">A clearer customer onboarding flow</text>
        <text x="62" y="832" font-size="19" fill="#73816c">Fewer handoffs. Clear owners.</text>
        <text x="647" y="747" font-size="14" letter-spacing="1.5" fill="#73816c">03 / DELIVERY PLAN</text>
        <text x="647" y="790" font-size="24" font-weight="600" fill="#263e32">One shared timeline for the team</text>
        <path d="M678 823H1084" stroke="#a7ba94" stroke-width="2"/>
        <circle cx="678" cy="823" r="7" fill="#466b4b"/>
        <circle cx="881" cy="823" r="7" fill="#779365"/>
        <circle cx="1084" cy="823" r="7" fill="#a1b68b"/>
        <text x="678" y="851" text-anchor="middle" font-size="15" fill="#73816c">Align</text>
        <text x="881" y="851" text-anchor="middle" font-size="15" fill="#73816c">Build</text>
        <text x="1084" y="851" text-anchor="middle" font-size="15" fill="#73816c">Review</text>
        <text x="600" y="891" text-anchor="middle" font-size="14" fill="#7e8c73">Illustrative presentation / Sample project</text>
      </g>
    </symbol>
    <symbol id="worklog-art" viewBox="0 0 1000 1320">
