  <view id="report" viewBox="100 0 1000 1320"/>
  <view id="deck" viewBox="0 1400 1200 900"/>
  <view id="worklog" viewBox="100 2380 1000 1320"/>
  <use href="#report-art" x="100" y="0" width="1000" height="1320"/>
